; Production PHP settings. The defaults in the official image are tuned for
; development, so the ones that matter in production are set explicitly.
expose_php = Off

memory_limit = 256M
upload_max_filesize = 16M
post_max_size = 16M
max_execution_time = 60

; Errors go to the container log, never to the browser.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; The code never changes without a new image, so stat() on every include is
; wasted work. Rebuild and redeploy to pick up changes.
opcache.validate_timestamps = 0

; Defense in depth for CVE-2026-109619 / CVE-2026-115560 (PHP advisories,
; Oct 2026). The app never uses session upload progress.
session.upload_progress.enabled = Off
; PHP 8.5: blocks the confirmed fatal-backtrace path of CVE-2026-109619.
; Laravel records its own stack traces, so nothing is lost.
fatal_error_backtraces = Off
